# models/pointnet/config.yaml
# Configuration for PointNet model on DrivAerNet++ dataset

# Model architecture settings
feature_transform: false  # Whether to use feature transformation
dropout: 0.3             # Dropout rate
output_channels: 1       # Number of output channels (1 for pressure)

# Data settings
num_points: 10000        # Number of points to sample from each mesh
batch_size: 1           # Batch size for training
num_workers: 0           # Number of workers for data loading
cache_dir: null          # Directory to cache preprocessed data (null = auto)

# Training settings
epochs: 150              # Maximum number of epochs
lr: 0.001               # Initial learning rate
optimizer: adam          # Optimizer: adam, adamw, sgd
weight_decay: 0.0001    # Weight decay for regularization

# Adam optimizer settings
beta1: 0.9
beta2: 0.999
eps: 1.0e-08

# Loss function
loss: mse               # Loss function: mse, mae, smooth_l1, mse_mae
# For mse_mae combined loss:
# mse_weight: 0.5
# mae_weight: 0.5
# For smooth_l1:
# huber_delta: 1.0

# Learning rate scheduler
scheduler: reduce_on_plateau  # Scheduler: reduce_on_plateau, cosine, step, none
scheduler_mode: min          # For reduce_on_plateau: min or max
scheduler_patience: 10       # For reduce_on_plateau: patience in epochs
scheduler_factor: 0.1        # For reduce_on_plateau: reduction factor
min_lr: 1.0e-07             # Minimum learning rate

# Training options
early_stopping_patience: 20  # Early stopping patience in epochs
gradient_clip: 1.0          # Gradient clipping value

# Multi-GPU settings
multi_gpu: true             # Use multiple GPUs if available
distributed: false          # Use distributed data parallel (DDP)

# Random seed for reproducibility
seed: 42