# models/transolver_plus/config.yaml
# Configuration for Transolver++ with 7D input features

# Model selection
model_type: transolver_plus
use_lightweight: false  # Set to true for faster training

# Transolver++ architecture parameters
n_hidden: 256          # Hidden dimension
n_layers: 5            # Match original Transolver (was 4)
n_head: 8              # Number of attention heads
mlp_ratio: 1           # Match original Transolver (was 2)
slice_num: 32          # Number of slices for physics attention
dropout: 0.0           # Match original Transolver (was 0.1)
unified_pos: false     # Use unified position encoding
ref: 8                 # Reference grid size for unified pos

# General parameters
num_points: 10000          # Number of surface points (surface-only mode)
use_sdf: false            # Use surface-only 6D features [x,y,z,nx,ny,nz] - consistent with other Transolver models

# Data settings
batch_size: 128          # Adjust based on GPU memory, train=128
num_workers: 32         # Reduced for SDF computation
cache_dir: "/tmp/transolver_plus_surface_cache"  # Surface-only cache

# Training settings
epochs: 200
lr: 0.001
optimizer: adam        # Options: adam, adamw, sgd
weight_decay: 0.0      # Match original Transolver

# Loss function
loss: mse

# Learning rate scheduler
scheduler: steplr      # Use StepLR as requested
step_size: 50         # Reduce LR every 50 epochs
gamma: 0.1            # Multiply LR by 0.1
train_samples: 5311   # DrivAerNet training set size

# Training options
early_stopping_patience: 30
gradient_clip: 1.0
val_iter: 5           # Validate every 5 epochs (was 10)

# Multi-GPU settings
multi_gpu: true
distributed: false

# Random seed
seed: 42

# SDF and geometry processing settings
sdf_computation:
  surface_extraction_method: "auto"
  normal_computation: "auto_orient"
  distance_tolerance: 1e-6

# Feature normalization settings
normalize_features:
  normalize_coordinates: true
  normalize_sdf: true
  normalize_normals: false

# Additional settings
debug_shapes: true
log_sdf_stats: true
validate_geometry: true

# Memory management
memory_settings:
  max_cache_size_gb: 10
  clear_cache_every_n_epochs: 50
  prefetch_factor: 2

# For lightweight version:
