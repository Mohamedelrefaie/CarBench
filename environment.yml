name: drivaernet-benchmark
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.10

  # Core scientific computing
  - numpy=1.24.*
  - scipy=1.10.*
  - pandas=2.0.*
  
  # PyTorch and CUDA
  - pytorch=2.0.*
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8  # Adjust based on your CUDA version
  
  # Visualization
  - matplotlib=3.7.*
  - seaborn=0.12.*
  - plotly=5.14.*
  
  # Jupyter
  - jupyter
  - jupyterlab=4.0.*
  - ipywidgets
  
  # Development tools
  - pip
  - git
  - black
  - flake8
  - mypy
  
  # Additional conda packages
  - h5py=3.8.*
  - pyyaml=6.0
  - tqdm
  
  # Pip dependencies (not available in conda)
  - pip:
      # Point cloud libraries
      - pyvista>=0.40.0
      - trimesh>=3.21.0
      - open3d>=0.17.0
      
      # ML tools
      - torchmetrics>=0.11.0
      - tensorboard>=2.13.0
      - wandb>=0.15.0
      
      # Configuration
      - hydra-core>=1.3.0
      - omegaconf>=2.3.0
      
      # System monitoring
      - psutil>=5.9.0
      - GPUtil>=1.4.0
      
      # Testing
      - pytest>=7.3.0
      - pytest-cov>=4.0.0
      - pytest-xdist>=3.3.0
      
      # Code quality
      - pre-commit>=3.3.0
      - ruff>=0.0.270